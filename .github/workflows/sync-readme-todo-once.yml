name: One-shot README TODO sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Update README to verified dev TODO result
        env:
          EXPECTED_BLOB: 2d0e63fbb656bd00df4a9528b41bc09c1a925ddf
          CANDIDATE_URL: https://raw.githubusercontent.com/vp2sfwntbg-cmd/LUFFY-2/d3dded4a56528ff2ebad5e8531f252fe06fa637f/README.md
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 "$CANDIDATE_URL" -o README.md.candidate
          actual_blob="$(git hash-object README.md.candidate)"
          echo "candidate_blob=$actual_blob expected_blob=$EXPECTED_BLOB bytes=$(wc -c < README.md.candidate)"
          test "$actual_blob" = "$EXPECTED_BLOB"

          grep -q '^### 📝 Complete TODO List$' README.md.candidate
          test "$(grep -c '^- \[ \] \*\*' README.md.candidate)" -eq 215
          grep -q 'luffy/deepscaler/utils.py:45\*\* - Add logging for API calls and errors' README.md.candidate
          grep -q 'luffy/deepscaler/utils.py:114\*\* - Add support for different generation configurations' README.md.candidate
          grep -q 'luffy/verl/verl/protocol.py:114\*\* - Optimize memory usage during tensor reshaping' README.md.candidate
          grep -q 'luffy/verl/verl/protocol.py:351\*\* - (zhangchi.usc1992) whether to copy' README.md.candidate
          ! grep -q 'luffy/deepscaler/utils.py:48\*\*' README.md.candidate
          ! grep -q 'luffy/verl/verl/protocol.py:116\*\*' README.md.candidate

          mv README.md.candidate README.md
          rm -f .github/workflows/sync-readme-todo-once.yml

          git config user.name "Eastiasleeve94"
          git config user.email "316010752+Eastiasleeve94@users.noreply.github.com"
          git add README.md .github/workflows/sync-readme-todo-once.yml
          git status --short

          if git diff --cached --quiet -- README.md .github/workflows/sync-readme-todo-once.yml; then
            echo "No README/workflow changes to commit"
            exit 0
          fi

          git commit -m "docs: sync README TODO list with dev" -m "Remove completed entries, update shifted line numbers, and preserve the existing title, format, path order, and ascending line order."
          git push origin HEAD:dev
